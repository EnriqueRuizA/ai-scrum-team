<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Ollama Scrum Team</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <style>
    body { font-family: system-ui, sans-serif; background: #0f172a; color: #e5e7eb; margin: 0; padding: 20px; }
    .container { max-width: 800px; margin: 0 auto; }
    h1 { color: #22c55e; }
    .section { background: #1e293b; border-radius: 12px; padding: 20px; margin: 20px 0; border: 1px solid #334155; }
    label { display: block; margin-bottom: 5px; color: #9ca3af; font-size: 14px; }
    input, select, button { width: 100%; padding: 10px; margin-top: 5px; border-radius: 6px; border: none; }
    button { background: #22c55e; color: white; cursor: pointer; }
    button:hover { background: #16a34a; }
    .status { padding: 10px; border-radius: 6px; margin: 10px 0; }
    .ok { background: rgba(34, 197, 94, 0.2); color: #86efac; }
    .error { background: rgba(239, 68, 68, 0.2); color: #fca5a5; }
  </style>
</head>
<body>
<div class="container">
  <h1>AI Scrum Team (Ollama)</h1>
  
  <div class="section">
    <h2>Configuración de Ollama</h2>
    <label for="baseUrl">URL de Ollama:</label>
    <input type="text" id="baseUrl" name="baseUrl" value="http://localhost:11434" placeholder="http://localhost:11434">
    
    <label for="defaultModel">Modelo por defecto para todos los agentes:</label>
    <input type="text" id="defaultModel" name="defaultModel" value="llama3.2" placeholder="llama3.2">
    
    <label for="rag">Usar RAG (Retrieval Augmented Generation):</label>
    <select id="rag" name="rag">
      <option value="false" selected>No usar (más rápido)</option>
      <option value="true">Usar RAG (más preciso)</option>
    </select>
    <small style="display:block; margin-top:5px; color:#6b7280;">RAG indexa tus archivos (.md, .txt, .js, .ts, .json) para que el IA tenga contexto de tu proyecto</small>
    
    <button onclick="checkConnection()">Comprobar conexión con Ollama</button>
  </div>
  
  <div id="status" class="status status-error">Conexión pendiente…</div>
</div>

<script>
async function checkConnection() {
  const baseUrl = document.getElementById('baseUrl').value.replace(/^\$/, '$');
  const defaultModel = document.getElementById('defaultModel').value;
  const ragEnabled = document.getElementById('rag').value === 'true';
  const status = document.getElementById('status');
  
  try {
    const response = await fetch((baseUrl + '/api/tags'));
    if (response.ok) {
      const data = await response.json();
      status.className = 'status ok';
      status.innerHTML = '✓ Conexión exitosa! <br><small>Modelos disponibles: ' + Array.from(data.models || []).map(m => m.name).join(', ') + '</small>';
      
      // Actualizar config.json automáticamente
      updateConfig(baseUrl, defaultModel, ragEnabled);
    } else {
      status.className = 'status error';
      status.textContent = '✗ Error: ' + (await response.text()).substring(0, 200);
    }
  } catch (error) {
    status.className = 'status error';
    status.textContent = '✗ Error: ' + error.message;
  }
}

async function updateConfig(baseUrl, defaultModel, ragEnabled) {
  // Actualizar project-config.json automáticamente
  const configPath = './config/project-config.json';
  try {
    const currentConfig = require(configPath);
    currentConfig.agents.local.baseUrl = baseUrl;
    currentConfig.agents.local.model = defaultModel;
    currentConfig.agents.local.rag.enabled = ragEnabled;
    currentConfig.agents.rag.enabled = ragEnabled;
    require('fs-extra').writeJson(configPath, currentConfig, { spaces: 2 });
    console.log('Configuración actualizada en:', configPath);
  } catch (e) {
    console.error('No se pudo actualizar config:', e.message);
  }
}
</script>
</body>
</html>
